<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0a0a0c]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EventPulse - Modern Event Management & Attendance System{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            base: '#09090b',
                            card: '#121215',
                            cardAlt: '#18181b',
                            border: '#27272a',
                            borderLight: '#3f3f46'
                        },
                        amberTheme: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            glow: 'rgba(245, 158, 11, 0.15)'
                        },
                        brand: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            500: '#f59e0b',
                            600: '#eab308',
                            700: '#ca8a04',
                            800: '#a16207',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
            color: #e4e4e7;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background-color: black !important;
                color: white !important;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full flex flex-col antialiased bg-[#09090b] text-zinc-200">
    <!-- Navigation Bar -->
    <header class="no-print sticky top-0 z-40 bg-[#09090b]/90 backdrop-blur border-b border-[#27272a]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <a href="/" class="flex items-center space-x-2.5 group">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-zinc-950 shadow-md shadow-amber-500/20 group-hover:scale-105 transition">
                            <i data-lucide="calendar-check" class="w-5 h-5 text-zinc-950 font-black"></i>
                        </div>
                        <div>
                            <span class="text-xl font-extrabold tracking-tight text-white uppercase">Event<span class="text-[#f59e0b]">Pulse</span></span>
                            <span class="hidden sm:inline-block ml-2 px-2 py-0.5 text-xs font-bold uppercase tracking-wider bg-amber-500/10 text-amber-400 rounded-full border border-amber-500/20">Pro</span>
                        </div>
                    </a>
                </div>

                <!-- Center Nav Links -->
                <nav class="hidden md:flex space-x-1">
                    <a href="/" class="px-3.5 py-2 text-sm font-medium rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800/60 transition flex items-center space-x-1.5">
                        <i data-lucide="layout-grid" class="w-4 h-4 text-zinc-400"></i>
                        <span>All Events</span>
                    </a>
                    {% if event %}
                    <div class="flex items-center space-x-1 border-l border-zinc-800 pl-3 ml-2">
                        <a href="/events/{{ event.id }}" class="px-3 py-1.5 text-xs font-semibold rounded-lg {% if active_tab == 'overview' %}bg-amber-500/10 text-amber-400 border border-amber-500/30{% else %}text-zinc-400 hover:bg-zinc-800/60 hover:text-zinc-200{% endif %} flex items-center space-x-1">
                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                            <span>Overview</span>
                        </a>
                        <a href="/events/{{ event.id }}/form-builder" class="px-3 py-1.5 text-xs font-semibold rounded-lg {% if active_tab == 'form-builder' %}bg-amber-500/10 text-amber-400 border border-amber-500/30{% else %}text-zinc-400 hover:bg-zinc-800/60 hover:text-zinc-200{% endif %} flex items-center space-x-1">
                            <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
                            <span>Form Builder</span>
                        </a>
                        <a href="/events/{{ event.id }}/register" target="_blank" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-zinc-400 hover:bg-zinc-800/60 hover:text-zinc-200 flex items-center space-x-1">
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            <span>Pre-Registration</span>
                        </a>
                        <a href="/events/{{ event.id }}/checkin" class="px-3 py-1.5 text-xs font-semibold rounded-lg {% if active_tab == 'checkin' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/30{% else %}text-zinc-400 hover:bg-zinc-800/60 hover:text-zinc-200{% endif %} flex items-center space-x-1">
                            <i data-lucide="scan-line" class="w-3.5 h-3.5"></i>
                            <span>Attendance Kiosk</span>
                        </a>
                        <a href="/events/{{ event.id }}/followup" class="px-3 py-1.5 text-xs font-semibold rounded-lg {% if active_tab == 'followup' %}bg-amber-500/10 text-amber-300 border border-amber-500/30{% else %}text-zinc-400 hover:bg-zinc-800/60 hover:text-zinc-200{% endif %} flex items-center space-x-1">
                            <i data-lucide="user-x" class="w-3.5 h-3.5"></i>
                            <span>Not Attending</span>
                        </a>
                        <a href="/events/{{ event.id }}/report" class="px-3 py-1.5 text-xs font-semibold rounded-lg {% if active_tab == 'report' %}bg-purple-500/10 text-purple-400 border border-purple-500/30{% else %}text-zinc-400 hover:bg-zinc-800/60 hover:text-zinc-200{% endif %} flex items-center space-x-1">
                            <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                            <span>Final Report</span>
                        </a>
                    </div>
                    {% endif %}
                </nav>

                <!-- Action Button -->
                <div class="flex items-center space-x-2">
                <!-- Logout Button -->
                    <a href="/logout" title="Logout" class="inline-flex items-center px-3 py-2 text-sm font-semibold rounded-xl text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 transition">
                        <i data-lucide="log-out" class="w-4 h-4 mr-1.5"></i>
                        <span>Logout</span>
                    </a>       
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Create Event Modal -->
    <div id="create-event-modal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#121215] rounded-2xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-zinc-800 transform transition-all">
            <div class="flex justify-between items-center pb-4 border-b border-zinc-800">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center">
                        <i data-lucide="calendar-plus" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-1.5">
                            <span class="w-4 h-0.5 bg-amber-500"></span>
                            <span class="text-[10px] font-bold text-amber-400 uppercase tracking-widest">Event Operations</span>
                        </div>
                        <h3 class="text-lg font-bold text-white">Create New Event</h3>
                    </div>
                </div>
                <button onclick="closeCreateModal()" class="text-zinc-400 hover:text-zinc-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="create-event-form" onsubmit="submitCreateEvent(event)" class="mt-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Event Title *</label>
                    <input type="text" name="title" required placeholder="e.g. Annual Tech Symposium 2026" class="w-full px-3.5 py-2.5 bg-[#18181b] border border-zinc-800 rounded-xl text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-1 focus:ring-amber-500 focus:border-amber-500 transition">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Event Date *</label>
                        <input type="date" name="event_date" required class="w-full px-3.5 py-2.5 bg-[#18181b] border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-amber-500 focus:border-amber-500 transition [color-scheme:dark]">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Category</label>
                        <select name="category" class="w-full px-3.5 py-2.5 bg-[#18181b] border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-amber-500 focus:border-amber-500 transition">
                            <option value="Conference" class="bg-zinc-900">Conference</option>
                            <option value="Workshop" class="bg-zinc-900">Workshop / Seminar</option>
                            <option value="College Fest" class="bg-zinc-900">College / University Fest</option>
                            <option value="Corporate Meet" class="bg-zinc-900">Corporate / Business Meet</option>
                            <option value="Hackathon" class="bg-zinc-900">Hackathon / Competition</option>
                            <option value="Webinar" class="bg-zinc-900">Webinar / Online Session</option>
                            <option value="Social Event" class="bg-zinc-900">Social / Community Meet</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Start Time</label>
                        <input type="time" name="start_time" value="09:30" class="w-full px-3.5 py-2.5 bg-[#18181b] border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-amber-500 focus:border-amber-500 transition [color-scheme:dark]">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">End Time</label>
                        <input type="time" name="end_time" value="17:00" class="w-full px-3.5 py-2.5 bg-[#18181b] border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-amber-500 focus:border-amber-500 transition [color-scheme:dark]">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Venue / Address</label>
                        <input type="text" name="venue" value="Main Auditorium / Hall A" class="w-full px-3.5 py-2.5 bg-[#18181b] border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-amber-500 focus:border-amber-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Max Seat Capacity</label>
                        <input type="number" name="max_capacity" value="150" min="1" class="w-full px-3.5 py-2.5 bg-[#18181b] border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-amber-500 focus:border-amber-500 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Description</label>
                    <textarea name="description" rows="2" placeholder="Key agenda, topics covered, and guidelines..." class="w-full px-3.5 py-2.5 bg-[#18181b] border border-zinc-800 rounded-xl text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-1 focus:ring-amber-500 focus:border-amber-500 transition"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-zinc-800">
                    <button type="button" onclick="closeCreateModal()" class="px-4 py-2.5 text-sm font-semibold rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-800 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 text-sm font-bold rounded-xl text-zinc-950 bg-[#fbbf24] hover:bg-[#f59e0b] shadow-md shadow-amber-500/20 transition">Create Event</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Audio Synthesizer Beeps for QR Scanner (Zero external files needed) -->
    <script>
        const AudioFeedback = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            },
            playSuccess() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch(e) {}
            },
            playWarning() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch(e) {}
            },
            playError() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch(e) {}
            }
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-2xl border text-sm font-semibold flex items-center space-x-2 transform transition duration-300 translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-[#121215] text-emerald-400 border-emerald-500/30' :
                type === 'error' ? 'bg-[#121215] text-rose-400 border-rose-500/30' :
                type === 'warning' ? 'bg-[#121215] text-amber-400 border-amber-500/30' : 'bg-[#121215] text-zinc-200 border-zinc-700'
            }`;
            const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-octagon' : type === 'warning' ? 'alert-triangle' : 'info';
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function openCreateModal() {
            const modal = document.getElementById('create-event-modal');
            modal.classList.remove('hidden');
            const dateInput = modal.querySelector('input[name="event_date"]');
            if (!dateInput.value) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
            }
        }

        function closeCreateModal() {
            document.getElementById('create-event-modal').classList.add('hidden');
        }

        async function submitCreateEvent(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.max_capacity = parseInt(data.max_capacity) || 100;
            
            try {
                const res = await fetch('/api/events', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    showToast('Event created successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = `/events/${result.event_id}`;
                    }, 500);
                } else {
                    showToast(result.detail || 'Failed to create event', 'error');
                }
            } catch (err) {
                showToast('Error connecting to server', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
